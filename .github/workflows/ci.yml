# ── CI Pipeline — Autonomous Financial Research Agent ────────────────────────
#
# Triggers on every push to main and every pull request targeting main.
#
# What it does:
#   1. Runs the full 176-test suite (python -m tests.test_chat_agent)
#   2. Verifies the FastAPI app imports and initializes without errors
#   3. Checks that the Docker image builds successfully
#
# WHY this matters for this specific project:
#   The test suite has already caught 3 real production bugs:
#   - The psycopg2 lastrowid bug (invisible on SQLite, found on live Postgres)
#   - The calculator duplicate-schema bug
#   - The field-filter whitespace normalization bug
#   Automating the test run on every commit means regressions cannot slip
#   through — the same suite that found bugs in development will catch them
#   in future changes too.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── Job 1: Run the test suite ───────────────────────────────────────────────
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]
        # Why only 3.11: the project targets 3.11 specifically (type hints,
        # match statements). Testing 3.12 is a reasonable future addition
        # once dependencies are verified.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # pip cache — avoids re-downloading packages on every run
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        # The app creates these at runtime; tests need them to exist
        run: |
          mkdir -p output sec_data

      - name: Run full test suite
        # All secrets are faked inside the test suite via install_fake_tools()
        # so no real API keys are needed in CI. The tests use SQLite in the
        # output/ directory created above.
        env:
          # Minimal env so imports don't fail looking for keys
          # Real values are NOT needed — the test suite mocks all external calls
          GROQ_API_KEY: "fake-key-for-ci"
          LANGCHAIN_TRACING_V2: "false"
          EVAL_ENABLED: "false"
        run: |
          python -m tests.test_chat_agent

      - name: Report test results
        if: always()
        run: |
          echo "Test run complete. Check output above for pass/fail counts."

  # ── Job 2: Verify the app starts correctly ──────────────────────────────────
  smoke-test:
    name: Smoke test (import + DB init)
    runs-on: ubuntu-latest
    needs: test   # only run if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p output sec_data

      - name: Verify DB initialization
        # Tests that the schema initializes cleanly on SQLite — every table,
        # every index, the migration for new columns. Catches schema errors
        # that would only appear on first startup in production.
        env:
          GROQ_API_KEY: "fake-key-for-ci"
          LANGCHAIN_TRACING_V2: "false"
        run: |
          python -c "
          from database.connection import init_db
          init_db(force=True)
          print('Schema init: OK')
          from evaluation.evaluator import _init
          _init()
          print('Evaluator schema init: OK')
          "

      - name: Verify FastAPI app imports
        # Tests that the FastAPI app module loads without errors — catches
        # circular imports, missing config, or broken router registrations
        # before they reach production.
        env:
          GROQ_API_KEY: "fake-key-for-ci"
          LANGCHAIN_TRACING_V2: "false"
          EVAL_ENABLED: "false"
        run: |
          python -c "
          import api.server as server
          print('FastAPI app import: OK')
          print(f'Routes registered: {len(server.app.routes)}')
          "

  # ── Job 3: Docker build verification ───────────────────────────────────────
  docker-build:
    name: Verify Docker image builds
    runs-on: ubuntu-latest
    needs: test   # only run if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # build-only, do not push. This verifies:
        # - All COPY paths exist
        # - All apt-get packages install
        # - All pip packages install within the builder stage
        # - The multi-stage build completes without error
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: financial-agent:ci-test
          # Use GitHub Actions cache to speed up repeated builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs health check
        # Start the container with a fake key, wait for it to be ready,
        # then hit /api/health. Expects {"status":"degraded"} (degraded
        # because the key is fake) but NOT a 500 or crash.
        run: |
          docker run -d \
            --name ci-agent \
            -p 8000:8000 \
            -e GROQ_API_KEY=fake-key-for-ci \
            -e LANGCHAIN_TRACING_V2=false \
            -e EVAL_ENABLED=false \
            financial-agent:ci-test

          # Wait up to 30s for the app to start
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "App is up after ${i}s"
              break
            fi
            echo "Waiting for app... (${i}s)"
            sleep 1
          done

          # Check the response — accepts ok or degraded, not a 500
          RESPONSE=$(curl -s http://localhost:8000/api/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | python -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data.get('status') in ('ok', 'degraded'), f'Unexpected status: {data}'
          print(f'Health check passed: status={data[\"status\"]}')
          "

          docker stop ci-agent
          docker rm ci-agent
