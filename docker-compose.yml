# docker-compose.yml — Autonomous Financial Research Agent
#
# Usage (SQLite, default):
#   docker-compose up --build
#
# Usage (Postgres):
#   docker-compose --profile postgres up --build

services:

  # ── Main application (SQLite — default, no profile needed) ────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: financial-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_PROJECT=financial-agent
    volumes:
      - agent_output:/app/output
      - agent_sec_data:/app/sec_data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── PostgreSQL (optional — only with: docker-compose --profile postgres up) 
  postgres:
    image: postgres:16-alpine
    container_name: financial-agent-db
    environment:
      POSTGRES_DB: financial_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d financial_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]
    restart: unless-stopped

volumes:
  agent_output:
    driver: local
  agent_sec_data:
    driver: local
  postgres_data:
    driver: local