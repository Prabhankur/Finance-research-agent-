<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Financial Research Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  .app { flex: 1; display: flex; min-height: 0; }

  #sidebar {
    width: 240px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; transition: width .15s;
  }
  #sidebar.collapsed { width: 0; border-right: none; }
  #sidebar .sidebar-inner { width: 240px; display: flex; flex-direction: column; height: 100%; }
  #sidebar-header {
    padding: 12px; border-bottom: 1px solid var(--border);
  }
  #sidebar-new {
    width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 8px 10px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  #thread-list { flex: 1; overflow-y: auto; padding: 6px; }
  .thread-item {
    display: flex; align-items: center; gap: 6px; padding: 8px 9px; border-radius: 6px;
    cursor: pointer; font-size: 13px; color: var(--muted); margin-bottom: 2px;
  }
  .thread-item:hover { background: var(--panel-2); color: var(--text); }
  .thread-item.active { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .thread-item .t-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-item .t-del {
    opacity: 0; background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 2px 4px;
  }
  .thread-item:hover .t-del { opacity: 1; }
  .thread-item .t-del:hover { color: var(--red); }
  #sidebar-empty { padding: 16px 10px; font-size: 12px; color: var(--muted); }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--green); }
  .dot.bad { background: var(--red); }
  header .spacer { flex: 1; }
  header button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  header button:hover { border-color: var(--accent); }

  #chat { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { margin-bottom: 20px; display: flex; gap: 12px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .user .avatar { background: #1f6feb33; color: var(--accent); }
  .bot .avatar { background: #3fb95033; color: var(--green); }
  .body { flex: 1; min-width: 0; }
  .body p { margin: 0 0 10px; }
  .body table { border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  .body td, .body th { border: 1px solid var(--border); padding: 5px 10px; }
  .body th { background: var(--panel-2); }
  .body code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .body ul { margin: 6px 0; padding-left: 20px; }

  .status {
    font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .spin {
    width: 11px; height: 11px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }

  .tools { margin: 8px 0 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tool {
    font-size: 12px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  }
  .tool.success { border-color: #3fb95055; color: var(--green); }
  .tool.failed  { border-color: #f8514955; color: var(--red); }
  .tool.empty   { border-color: #d2992255; color: var(--amber); }

  /* Flow diagram: replaces bare chips with a connected sequence so the user
     can see the agent's actual tool-call PATH for the turn, not just an
     unordered set of pills. */
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 8px 0 4px; }
  .flow-group { display: flex; gap: 4px; align-items: center; }
  .flow-node {
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .flow-node .fn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .flow-node.success { border-color: #3fb95055; color: var(--green); }
  .flow-node.success .fn-dot { background: var(--green); }
  .flow-node.failed  { border-color: #f8514955; color: var(--red); }
  .flow-node.failed  .fn-dot { background: var(--red); }
  .flow-node.empty   { border-color: #d2992255; color: var(--amber); }
  .flow-node.empty   .fn-dot { background: var(--amber); }
  .flow-arrow { color: var(--border); font-size: 13px; }

  .chart-box {
    margin: 12px 0; padding: 12px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; max-width: 560px;
  }
  .chart-box canvas { max-height: 280px; }

  .contradiction-banner {
    margin: 10px 0; padding: 10px 14px; border-radius: 8px;
    background: #3a2a0a; border: 1px solid #d29922; font-size: 13px;
  }
  .contradiction-banner .cb-title {
    display: flex; align-items: center; gap: 6px; color: #d29922;
    font-weight: 600; margin-bottom: 6px;
  }
  .contradiction-banner .cb-row { color: var(--text); margin: 2px 0; }
  .contradiction-banner .cb-tier {
    display: inline-block; padding: 0 5px; border-radius: 4px; font-size: 11px;
    background: var(--panel-2); border: 1px solid var(--border); margin-left: 4px;
  }
  .contradiction-banner .cb-pick { color: var(--green); font-size: 12px; margin-top: 4px; }

  .report-card {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    background: var(--panel); border-radius: 8px; padding: 12px 14px; margin-top: 10px;
    font-size: 14px;
  }
  .report-card a { color: var(--accent); }

  .type-picker { margin-top: 10px; }
  .type-picker .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .type-btn {
    display: block; width: 100%; text-align: left; margin-bottom: 6px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .type-btn:hover { border-color: var(--accent); }
  .type-btn.suggested { border-color: var(--accent); }
  .type-btn.suggested::after { content: " · suggested"; color: var(--accent); font-size: 11px; }
  .type-btn:disabled { opacity: .4; cursor: not-allowed; }
  .type-cancel {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 2px;
  }

  footer { border-top: 1px solid var(--border); padding: 14px 20px; background: var(--panel); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font: inherit; max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .send {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 0 20px; cursor: pointer; font-weight: 600;
  }
  .send:disabled { opacity: .45; cursor: not-allowed; }
  .hint { max-width: 820px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .examples button {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    padding: 7px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  .examples button:hover { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>
<header>
  <button id="sidebarToggle" style="padding:6px 9px;font-size:14px">☰</button>
  <span class="dot" id="health"></span>
  <h1>Financial Research Agent</h1>
  <span class="spacer"></span>
  <span style="font-size:12px;color:var(--muted)" id="threadLabel"></span>
  <button id="newChat">New chat</button>
</header>

<div class="app">
<div id="sidebar">
  <div class="sidebar-inner">
    <div id="sidebar-header">
      <button id="sidebar-new">+ New chat</button>
    </div>
    <div id="thread-list"></div>
  </div>
</div>
<div id="main">
<div id="chat"><div class="wrap" id="log"></div></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask about a company, filing, metric or macro series…"></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for newline · ask for a "full report" to trigger the document pipeline</div>
</footer>
</div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let threadId = localStorage.getItem('threadId') || null;
let busy = false;

// Abort handle for the currently-streaming /api/chat response.
//
// Without this, clicking "New chat" while a response was still streaming
// left the fetch reader running silently: it kept writing tokens into DOM
// nodes we'd just wiped, kept the `busy` flag latched (which locks the
// input box), and — since the server had no way to know the client
// abandoned the stream — kept generating on the backend, consuming Groq
// tokens against your daily quota for a response nobody would ever see.
// AbortController is the standard fetch cancellation primitive; aborting
// it throws in the reader loop, which the send() finally block already
// handles correctly.
let currentAbort = null;

function setThreadLabel() {
  document.getElementById('threadLabel').textContent = threadId ? threadId : 'new conversation';
}
setThreadLabel();

// Minimal markdown: bold, inline code, headers, bullets, pipe tables.
function md(text) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = esc(text).split('\n');
  let html = '', inTable = false, inList = false;

  const flush = () => {
    if (inTable) { html += '</table>'; inTable = false; }
    if (inList)  { html += '</ul>';    inList  = false; }
  };

  for (const line of lines) {
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const cells = line.trim().slice(1, -1).split('|').map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      if (!inTable) { flush(); html += '<table>'; inTable = true; }
      html += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      if (!inList) { flush(); html += '<ul>'; inList = true; }
      html += `<li>${line.replace(/^\s*[-*]\s+/, '')}</li>`;
      continue;
    }
    flush();
    if (/^#{1,4}\s/.test(line)) {
      html += `<p><strong>${line.replace(/^#{1,4}\s/, '')}</strong></p>`;
    } else if (line.trim() === '') {
      html += '';
    } else {
      html += `<p>${line}</p>`;
    }
  }
  flush();
  return html
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function addMsg(role, html) {
  const div = document.createElement('div');
  div.className = `msg ${role === 'user' ? 'user' : 'bot'}`;
  div.innerHTML = `<div class="avatar">${role === 'user' ? 'U' : 'AI'}</div><div class="body">${html}</div>`;
  log.appendChild(div);
  scroll();
  return div.querySelector('.body');
}

function scroll() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

function greet() {
  addMsg('bot', md(
    "I'm a financial research agent with live access to yfinance, SEC EDGAR, Alpha Vantage, Tavily and FRED. Ask me anything and I'll fetch real data rather than answering from memory."
  ) + `<div class="examples">
    <button data-q="What is Apple's revenue and free cash flow for the latest year?">Apple's revenue & FCF</button>
    <button data-q="Compare NVDA and AMD gross margins">NVDA vs AMD margins</button>
    <button data-q="What does Tesla's latest 10-K say about risk factors?">Tesla 10-K risks</button>
    <button data-q="What is the current US 10-year yield and CPI?">US 10Y & CPI</button>
    <button data-q="Generate a full research report on Microsoft">Full report on MSFT</button>
  </div>`);
}

log.addEventListener('click', e => {
  if (e.target.dataset.q && !busy) { input.value = e.target.dataset.q; send(); }
});

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = ''; input.style.height = 'auto';

  addMsg('user', md(text));

  const body = addMsg('bot', '');
  const status = document.createElement('div');
  status.className = 'status';
  status.innerHTML = '<span class="spin"></span><span>Thinking…</span>';
  body.appendChild(status);

  const tools = document.createElement('div');
  tools.className = 'flow';
  body.appendChild(tools);
  let toolRoundBoundary = false;  // set true right after a 'status: chat_tools' event

  const answer = document.createElement('div');
  body.appendChild(answer);

  let buffer = '';

  try {
    currentAbort = new AbortController();
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, thread_id: threadId }),
      signal: currentAbort.signal,
    });

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let raw = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      raw += dec.decode(value, { stream: true });
      const frames = raw.split('\n\n');
      raw = frames.pop();

      for (const frame of frames) {
        const ev = (frame.match(/^event: (.+)$/m) || [])[1];
        const dataLine = (frame.match(/^data: ([\s\S]+)$/m) || [])[1];
        if (!ev || !dataLine) continue;
        let data; try { data = JSON.parse(dataLine); } catch { continue; }

        if (ev === 'start') {
          threadId = data.thread_id;
          localStorage.setItem('threadId', threadId);
          setThreadLabel();
        } else if (ev === 'status') {
          status.querySelector('span:last-child').textContent = data.label + '…';
          // Each time chat_tools is about to run, mark a round boundary so
          // the NEXT batch of tool nodes gets a connector arrow before it —
          // this is what turns a flat set of chips into an actual flow.
          if (data.node === 'chat_tools') toolRoundBoundary = true;
        } else if (ev === 'tool') {
          if (toolRoundBoundary && tools.children.length) {
            const arrow = document.createElement('span');
            arrow.className = 'flow-arrow';
            arrow.textContent = '→';
            tools.appendChild(arrow);
          }
          toolRoundBoundary = false;
          const node = document.createElement('span');
          node.className = `flow-node ${data.status}`;
          node.innerHTML = `<span class="fn-dot"></span>${data.tool} · ${data.duration_s}s`;
          tools.appendChild(node);
          scroll();
        } else if (ev === 'chart_data') {
          renderChart(body, data);
        } else if (ev === 'contradiction') {
          renderContradiction(body, data);
        } else if (ev === 'token') {
          status.remove();
          buffer += data.text;
          answer.innerHTML = md(buffer);
          scroll();
        } else if (ev === 'report_requested') {
          startReport(body, data);
        } else if (ev === 'report_offer') {
          renderTypePicker(body, data);
        } else if (ev === 'error') {
          status.remove();
          answer.innerHTML = `<p style="color:var(--red)">Error: ${data.message}</p>`;
        }
      }
    }
  } catch (err) {
    // A user-triggered abort (New Chat / thread switch) throws AbortError.
    // That is not a failure — the request was deliberately cancelled — so
    // don't surface it as one and don't leave an "error" line in a chat
    // panel the user is about to leave anyway.
    if (err.name === 'AbortError') {
      // Panel is already gone or being replaced; nothing to display.
    } else {
      answer.innerHTML = `<p style="color:var(--red)">Connection failed: ${err.message}</p>`;
    }
  } finally {
    status.remove();
    busy = false; sendBtn.disabled = false;
    currentAbort = null;
    input.focus();
    loadThreadList();
  }
}

// Renders clickable report-type buttons under the assistant's offer message.
// Clicking one just SENDS a normal chat message naming that type — the same
// path a user typing "valuation risk please" would take. That keeps exactly
// one code path (nodes/intent_router.py's _match_report_type_override)
// deciding what "the user picked type X" means, instead of the button having
// its own separate route straight to /api/report.
function renderTypePicker(container, data) {
  const box = document.createElement('div');
  box.className = 'type-picker';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = 'Choose a report type, or reply "yes" for the suggested one:';
  box.appendChild(label);

  const buttons = [];
  Object.entries(data.types).forEach(([code, typeLabel]) => {
    const btn = document.createElement('button');
    btn.className = 'type-btn' + (code === data.suggested_type ? ' suggested' : '');
    btn.textContent = typeLabel;
    btn.onclick = () => {
      buttons.forEach(b => b.disabled = true);
      cancelBtn.disabled = true;
      input.value = `Generate it as a ${typeLabel} report`;
      send();
    };
    buttons.push(btn);
    box.appendChild(btn);
  });

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'type-cancel';
  cancelBtn.textContent = "No thanks, I'll ask in chat";
  cancelBtn.onclick = () => {
    buttons.forEach(b => b.disabled = true);
    cancelBtn.disabled = true;
    input.value = 'no';
    send();
  };
  box.appendChild(cancelBtn);

  container.appendChild(box);
  scroll();
}

// Renders a cross-source disagreement flagged by the deterministic
// contradiction detector (utils/contradiction_detector.py). This is purely
// user-visible transparency — the detector already injected the same
// information into the synthesis prompt as text, so the model has already
// seen this; this banner exists so the USER sees it too, without having to
// infer it from prose.
function renderContradiction(container, note) {
  const box = document.createElement('div');
  box.className = 'contradiction-banner';

  const period = note.period_end ? ` (${note.period_end})` : '';
  const cur = note.current || {};
  const alts = note.alternates || [];
  const pick = note.primary_recommendation || {};

  let html = `<div class="cb-title">⚠ Cross-source disagreement — ${note.ticker || ''} ${note.field || ''}${period}</div>`;
  html += `<div class="cb-row">${cur.provider}: ${Number(cur.value).toLocaleString()}<span class="cb-tier">tier ${cur.tier}</span></div>`;
  alts.forEach(a => {
    html += `<div class="cb-row">${a.provider}: ${Number(a.value).toLocaleString()}<span class="cb-tier">tier ${a.tier}</span></div>`;
  });
  if (pick.provider) {
    html += `<div class="cb-pick">→ Leading with ${pick.provider} (higher evidence tier)</div>`;
  }
  box.innerHTML = html;
  container.appendChild(box);
  scroll();
}

// Renders a chart the AGENT itself requested via the render_chart tool (see
// tools/chart_tool.py). The full spec — labels/series/values — arrives via
// the chart_data SSE event, never round-tripping through the model's own
// token budget (see api/server.py's emission of this event for why).
const CHART_COLORS = ['#2f81f7', '#3fb950', '#d29922', '#f85149', '#a371f7', '#39c5cf'];

function renderChart(container, spec) {
  const box = document.createElement('div');
  box.className = 'chart-box';
  const canvas = document.createElement('canvas');
  box.appendChild(canvas);
  container.appendChild(box);
  scroll();

  const datasets = (spec.series || []).map((s, i) => ({
    label: s.name || `Series ${i + 1}`,
    data: s.values || [],
    backgroundColor: CHART_COLORS[i % CHART_COLORS.length] + (spec.chart_type === 'line' ? '33' : 'cc'),
    borderColor: CHART_COLORS[i % CHART_COLORS.length],
    borderWidth: spec.chart_type === 'line' ? 2 : 1,
    tension: 0.3,
    fill: spec.chart_type === 'line',
  }));

  try {
    new Chart(canvas.getContext('2d'), {
      type: spec.chart_type === 'line' ? 'line' : 'bar',
      data: { labels: spec.labels || [], datasets },
      options: {
        responsive: true,
        plugins: {
          title: { display: !!spec.title, text: spec.title || '', color: '#e6edf3', font: { size: 13 } },
          legend: { display: datasets.length > 1, labels: { color: '#8b949e', font: { size: 11 } } },
        },
        scales: {
          x: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
          y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
        },
      },
    });
  } catch (err) {
    box.innerHTML = `<div style="color:var(--red);font-size:13px">Chart render failed: ${err.message}</div>`;
  }
}

async function startReport(container, data) {
  const card = document.createElement('div');
  card.className = 'report-card';
  card.innerHTML = '<span class="spin" style="display:inline-block;vertical-align:-1px"></span> Queuing report…';
  container.appendChild(card);

  const res = await fetch('/api/report', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: data.query, report_type: data.report_type, thread_id: threadId }),
  });
  const job = await res.json();

  const started = Date.now();
  const poll = setInterval(async () => {
    const s = await (await fetch(`/api/report/${job.job_id}`)).json();
    const secs = Math.round((Date.now() - started) / 1000);

    if (s.status === 'completed') {
      clearInterval(poll);
      card.innerHTML = `<strong>Report ready</strong> — ${s.report_type} · ${s.duration_s}s
        <br><a href="${s.download_url}" download>Download document</a>`;
    } else if (s.status === 'failed') {
      clearInterval(poll);
      card.innerHTML = `<strong style="color:var(--red)">Report failed</strong><br><code>${s.error}</code>`;
    } else {
      card.innerHTML = `<span class="spin" style="display:inline-block;vertical-align:-1px"></span>
        Generating ${data.report_type || ''} report… ${secs}s elapsed`;
    }
  }, 3000);
}

// ── Sidebar: thread list ────────────────────────────────────────────────────

async function loadThreadList() {
  try {
    const res = await fetch('/api/threads');
    const { threads } = await res.json();
    renderThreadList(threads);
  } catch (err) {
    console.error('Failed to load thread list', err);
  }
}

function renderThreadList(threads) {
  const box = document.getElementById('thread-list');
  box.innerHTML = '';

  if (!threads.length) {
    box.innerHTML = '<div id="sidebar-empty">No conversations yet</div>';
    return;
  }

  threads.forEach(t => {
    const item = document.createElement('div');
    item.className = 'thread-item' + (t.thread_id === threadId ? ' active' : '');
    item.innerHTML = `<span class="t-title">${t.title.replace(/</g, '&lt;')}</span>
                       <button class="t-del" title="Delete">×</button>`;
    item.querySelector('.t-title').onclick = () => switchThread(t.thread_id);
    item.querySelector('.t-del').onclick = async (e) => {
      e.stopPropagation();
      await fetch(`/api/threads/${t.thread_id}`, { method: 'DELETE' });
      if (t.thread_id === threadId) {
        threadId = null;
        localStorage.removeItem('threadId');
        log.innerHTML = '';
        setThreadLabel();
        greet();
      }
      loadThreadList();
    };
    box.appendChild(item);
  });
}

async function switchThread(id) {
  if (id === threadId) return;
  if (currentAbort) currentAbort.abort();   // same reason as New Chat
  threadId = id;
  localStorage.setItem('threadId', threadId);
  setThreadLabel();
  log.innerHTML = '';

  try {
    const h = await (await fetch(`/api/threads/${threadId}/history`)).json();
    if (h.exists && h.messages.length) {
      h.messages.filter(m => m.role !== 'tool').forEach(m => addMsg(m.role, md(m.content)));
    } else {
      greet();
    }
  } catch {
    greet();
  }
  loadThreadList();
}

document.getElementById('sidebar-new').addEventListener('click', () => {
  document.getElementById('newChat').click();
});

document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

document.getElementById('newChat').addEventListener('click', () => {
  // Abort any in-flight response before wiping the DOM. Otherwise the
  // reader loop keeps running against nodes we're about to delete and the
  // `busy` flag stays latched until the orphaned stream finishes on its
  // own — which from the user's side looks exactly like "New Chat froze
  // the app". See the currentAbort declaration at the top for the full
  // rationale.
  if (currentAbort) currentAbort.abort();
  threadId = null;
  localStorage.removeItem('threadId');
  log.innerHTML = '';
  setThreadLabel();
  greet();
  loadThreadList();
});

// Restore an existing conversation, or greet. Also loads the sidebar.
(async () => {
  try {
    const h = await (await fetch('/api/health')).json();
    const dot = document.getElementById('health');
    dot.className = 'dot ' + (h.status === 'ok' ? 'ok' : 'bad');
    dot.title = JSON.stringify(h.keys_present, null, 1);
  } catch {}

  loadThreadList();

  if (threadId) {
    try {
      const h = await (await fetch(`/api/threads/${threadId}/history`)).json();
      if (h.exists && h.messages.length) {
        h.messages.filter(m => m.role !== 'tool')
                  .forEach(m => addMsg(m.role, md(m.content)));
        return;
      }
    } catch {}
  }
  greet();
})();
</script>
